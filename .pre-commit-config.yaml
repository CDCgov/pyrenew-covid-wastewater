repos:
  # Basic file cleanliness
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  # Python
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      # Sort imports
      - id: ruff-check
        # Run the formatter
      - id: ruff-format
    # UV Pre-Commit Hook
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.13
    hooks:
      - id: uv-lock
  # Bash
  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
  # Secrets
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: ^(package\.lock\.json|src/cfa/stf/routine/epiautogp/Manifest\.toml)$
  # R
  - repo: https://github.com/posit-dev/air-pre-commit
    rev: 0.11.0
    hooks:
      - id: air-format
  - repo: https://github.com/etiennebacher/jarl-pre-commit
    rev: 0.6.0
    hooks:
      - id: jarl-check
        args: ["--fix", "--allow-dirty"]
  # Julia
  - repo: https://github.com/fredrikekre/runic-pre-commit
    rev: v2.2.0
    hooks:
      - id: runic
  # Typos
  - repo: https://github.com/adhtruong/mirrors-typos
    rev: v1.50.1
    hooks:
      - id: typos
        args: ["--force-exclude"]
        exclude: ^src/cfa/stf/routine/epiautogp/Manifest\.toml$
  # Quarto / Markdown
  - repo: https://github.com/jolars/panache-pre-commit
    rev: v3.10.0
    hooks:
      - id: panache-format
      - id: panache-lint
