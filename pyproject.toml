[project]
name = "cfa-stf-routine-forecasting"
version = "0.1.0"
description = "Pipelines for forecasting respiratory diseases"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
  {name = "Damon Bayer", email = "xum8@cdc.gov"},
  {name = "Dylan H. Morris"},
  {name = "Subekshya Bidari"},
  {name = "Jon Kislin", email = "qxk3@cdc.gov"}
]

dependencies = [
    "arviz[h5netcdf]>=1.3.0",
    "cfa-cloudops",
    "cfa-dagster",
    "cfa-stf-data",
    "cfa-stf-forecasttools",
    "jax",
    "numpy",
    "numpyro",
    "polarbayes",
    "polars[pyarrow,numpy]>=1.36",
    "pydantic",
    "pygit2>=1.17.0",
    "pyrenew",
    "pyrenew-multisignal",
    "pypdf>=6.10.1",
]

[project.scripts]
cfa-stf-routine-create-pool = "cfa.stf.routine.create_pool:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "cfa.stf.routine"
source-include = [
    "dagster/**",
    "dagster_defs.py",
    "tests/**",
]
source-exclude = [
    ".DS_Store",
    "/test_output",
]

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "cfa.stf.routine"
defs_module = "cfa.stf.routine.dagster.defs"
code_location_target_module = "cfa.stf.routine.dagster.defs"

[dependency-groups]
dev = [
  {include-group = "dagster-config-editor"},
  {include-group = "test"},
  "ipykernel",
  "ipywidgets",
  "jupyter>=1.0.0",
  "cfa-dagster[dev]",
  "pre-commit>=4.6.0",
]
dagster-config-editor = [
    "py-yaml12",
    "rich",
]
test = [
    "plotnine>=0.15.3",
    "pytest>=8.3.2",
    "pytest-cov>=5.0.0",
    "pytest-mpl>=0.17.0",
]


[tool.ruff]
fix = true
src = ["src"]
target-version = "py313"

[tool.ruff.lint]
select = ["I", "E4", "E7", "E9", "F", "UP"]

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-config",
    "--strict-markers",
]
markers = [
    "pipeline_e2e: end-to-end pipeline integration test",
    "model_integration: single-model pipeline integration test",
]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["cfa.stf.routine"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.uv.sources]
cfa-dagster = { git = "https://github.com/cdcgov/cfa-dagster", rev = "v1.5.0" }
cfa-cloudops = { git = "https://github.com/CDCgov/cfa-cloudops.git" }
pyrenew-multisignal = {git = "https://github.com/CDCgov/pyrenew-multisignal", rev = "1c9fa48"}
polarbayes = { git = "https://github.com/cdcgov/polarbayes", rev = "main" }
cfa-stf-data = { git = "https://github.com/CDCgov/cfa-stf-data", rev = "v0.2.0" }
cfa-stf-forecasttools = { git = "https://github.com/CDCgov/cfa-stf-forecasttools", rev = "main" }
